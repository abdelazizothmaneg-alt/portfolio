<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="auto">
  <defs>
    <marker id="sArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C5A880" />
    </marker>
  </defs>

  <rect width="1000" height="360" fill="#0C0E14" rx="8" />
  
  <text x="30" y="32" font-family="'Bahnschrift', sans-serif" font-size="12" font-weight="700" letter-spacing="0.1em" fill="#C5A880">WATERFRONT ACTIVATION &amp; TRI-MODAL URBAN MOBILITY • JAZAN SUNSET CORNICHE</text>

  <!-- Step 1 -->
  <g transform="translate(30, 50)">
    <rect width="210" height="280" fill="#131620" stroke="rgba(255,255,255,0.08)" rx="6" />
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#C5A880">STEP 01</text>
    <text x="16" y="46" font-family="'Bahnschrift', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Linear Coastal Edge</text>
    <text x="16" y="64" font-family="sans-serif" font-size="10.5" fill="#94A3B8">3.2 km raw coastal strip</text>

    <!-- Water & Land Line -->
    <rect x="25" y="110" width="160" height="40" fill="#0369A1" opacity="0.4" />
    <rect x="25" y="150" width="160" height="60" fill="#78350F" opacity="0.3" />
    <line x1="25" y1="150" x2="185" y2="150" stroke="#38BDF8" stroke-width="2" />

    <text x="16" y="260" font-family="sans-serif" font-size="10" fill="#64748B">Red Sea Shoreline Exposure</text>
  </g>

  <path d="M 248 190 L 268 190" stroke="#C5A880" stroke-width="1.5" marker-end="url(#sArrow)" />

  <!-- Step 2 -->
  <g transform="translate(276, 50)">
    <rect width="210" height="280" fill="#131620" stroke="rgba(255,255,255,0.08)" rx="6" />
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#C5A880">STEP 02</text>
    <text x="16" y="46" font-family="'Bahnschrift', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Wave Tensile Shading</text>
    <text x="16" y="64" font-family="sans-serif" font-size="10.5" fill="#94A3B8">Dynamic bioclimatic canopies</text>

    <!-- Sinusoidal Wave Shade -->
    <path d="M 30 150 Q 60 120 90 150 T 150 150 T 180 150" fill="none" stroke="#C5A880" stroke-width="3" />
    <line x1="60" y1="135" x2="60" y2="190" stroke="#C5A880" stroke-width="1.5" />
    <line x1="120" y1="135" x2="120" y2="190" stroke="#C5A880" stroke-width="1.5" />

    <text x="16" y="260" font-family="sans-serif" font-size="10" fill="#C5A880">Heat Mitigation &amp; Misting</text>
  </g>

  <path d="M 494 190 L 514 190" stroke="#C5A880" stroke-width="1.5" marker-end="url(#sArrow)" />

  <!-- Step 3 -->
  <g transform="translate(522, 50)">
    <rect width="210" height="280" fill="#131620" stroke="rgba(255,255,255,0.08)" rx="6" />
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#C5A880">STEP 03</text>
    <text x="16" y="46" font-family="'Bahnschrift', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Tri-Modal Mobility</text>
    <text x="16" y="64" font-family="sans-serif" font-size="10.5" fill="#94A3B8">Segregated active transport</text>

    <!-- 3 parallel paths -->
    <line x1="30" y1="130" x2="180" y2="130" stroke="#38BDF8" stroke-width="4" />
    <text x="185" y="133" font-family="sans-serif" font-size="8" fill="#38BDF8">Jogging</text>

    <line x1="30" y1="155" x2="180" y2="155" stroke="#10B981" stroke-width="6" />
    <text x="185" y="158" font-family="sans-serif" font-size="8" fill="#10B981">Promenade</text>

    <line x1="30" y1="180" x2="180" y2="180" stroke="#EAB308" stroke-width="4" />
    <text x="185" y="183" font-family="sans-serif" font-size="8" fill="#EAB308">Bicycle</text>

    <text x="16" y="260" font-family="sans-serif" font-size="10" fill="#10B981">Zero Vehicular Conflict</text>
  </g>

  <path d="M 740 190 L 760 190" stroke="#C5A880" stroke-width="1.5" marker-end="url(#sArrow)" />

  <!-- Step 4 -->
  <g transform="translate(768, 50)">
    <rect width="202" height="280" fill="#131620" stroke="#C5A880" stroke-width="1.5" rx="6" />
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#C5A880">STEP 04 • FINAL</text>
    <text x="16" y="46" font-family="'Bahnschrift', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Civic Anchor Nodes</text>
    <text x="16" y="64" font-family="sans-serif" font-size="10.5" fill="#94A3B8">F&amp;B pavilions &amp; amphitheater</text>

    <!-- Circular Plazas along the strip -->
    <circle cx="65" cy="155" r="18" fill="rgba(229,199,158,0.2)" stroke="#C5A880" stroke-width="1.5" />
    <circle cx="140" cy="155" r="24" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1.5" />
    <line x1="30" y1="155" x2="175" y2="155" stroke="rgba(255,255,255,0.2)" stroke-dasharray="2,2" />

    <text x="16" y="260" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#C5A880">3.2 km Handover • Civic Impact</text>
  </g>
</svg>