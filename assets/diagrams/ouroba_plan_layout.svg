<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="auto">
  <defs>
    <pattern id="planGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="#0C0E14" rx="8" />
  <rect width="1000" height="520" fill="url(#planGrid)" />

  <!-- Sheet Title Block -->
  <text x="40" y="42" font-family="'Bahnschrift', sans-serif" font-size="14" font-weight="700" letter-spacing="0.1em" fill="#C5A880">GROUND LEVEL MASTER PLAN &amp; CIRCULATION • OUROBA BUSINESS TOWERS</text>
  <text x="40" y="62" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">SCALE 1:500 • SITE AREA: 18,200 m² • BUA: 48,500 m² • AL-OUROBA CORRIDOR, RIYADH</text>

  <!-- Compass / North Arrow -->
  <g transform="translate(930, 60)">
    <circle cx="0" cy="0" r="22" fill="#131620" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <polygon points="0,-18 5,0 0,-4 -5,0" fill="#C5A880" />
    <polygon points="0,18 5,0 0,4 -5,0" fill="#64748B" />
    <text x="-4" y="-24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#C5A880">N</text>
  </g>

  <!-- Main Arterial Road (Al-Ouroba Road) -->
  <rect x="40" y="90" width="920" height="40" fill="#151922" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="500" y="115" font-family="'Bahnschrift', sans-serif" font-size="11" letter-spacing="0.15em" fill="#64748B" text-anchor="middle">AL-OUROBA ARTERIAL HIGHWAY (60M R.O.W.)</text>
  <line x1="60" y1="110" x2="920" y2="110" stroke="rgba(255,255,255,0.15)" stroke-dasharray="12,12" />

  <!-- Property Boundary / Setbacks -->
  <rect x="70" y="150" width="860" height="320" fill="none" stroke="#C5A880" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="80" y="170" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#C5A880">PROPERTY LINE &amp; 6.0M MUNICIPAL SETBACK (BALADY)</text>

  <!-- Tower West Footprint -->
  <g transform="translate(140, 190)">
    <rect width="280" height="230" fill="#161B26" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Structural Grid Lines -->
    <line x1="70" y1="0" x2="70" y2="230" stroke="rgba(255,255,255,0.08)" />
    <line x1="140" y1="0" x2="140" y2="230" stroke="rgba(255,255,255,0.08)" />
    <line x1="210" y1="0" x2="210" y2="230" stroke="rgba(255,255,255,0.08)" />
    <line x1="0" y1="76" x2="280" y2="76" stroke="rgba(255,255,255,0.08)" />
    <line x1="0" y1="152" x2="280" y2="152" stroke="rgba(255,255,255,0.08)" />
    
    <!-- Central Core (Elevators / Stairs) -->
    <rect x="95" y="65" width="90" height="100" fill="#242B3B" stroke="#C5A880" stroke-width="1.2" />
    <text x="140" y="115" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#C5A880" text-anchor="middle">CORE / LIFTS</text>

    <!-- Label -->
    <text x="140" y="32" font-family="'Bahnschrift', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">TOWER WEST (COMMERCIAL)</text>
    <text x="140" y="48" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94A3B8" text-anchor="middle">G + 8 FLOORS • 24,000 m²</text>
  </g>

  <!-- Tower East Footprint -->
  <g transform="translate(580, 190)">
    <rect width="280" height="230" fill="#161B26" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Structural Grid Lines -->
    <line x1="70" y1="0" x2="70" y2="230" stroke="rgba(255,255,255,0.08)" />
    <line x1="140" y1="0" x2="140" y2="230" stroke="rgba(255,255,255,0.08)" />
    <line x1="210" y1="0" x2="210" y2="230" stroke="rgba(255,255,255,0.08)" />
    <line x1="0" y1="76" x2="280" y2="76" stroke="rgba(255,255,255,0.08)" />
    <line x1="0" y1="152" x2="280" y2="152" stroke="rgba(255,255,255,0.08)" />

    <!-- Central Core -->
    <rect x="95" y="65" width="90" height="100" fill="#242B3B" stroke="#C5A880" stroke-width="1.2" />
    <text x="140" y="115" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#C5A880" text-anchor="middle">CORE / LIFTS</text>

    <!-- Label -->
    <text x="140" y="32" font-family="'Bahnschrift', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">TOWER EAST (CORPORATE HQ)</text>
    <text x="140" y="48" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94A3B8" text-anchor="middle">G + 8 FLOORS • 24,500 m²</text>
  </g>

  <!-- Central Landscaped Retail Plaza -->
  <g transform="translate(435, 190)">
    <rect width="130" height="230" fill="rgba(16,185,129,0.08)" stroke="#10B981" stroke-width="1" stroke-dasharray="4,2" />
    <!-- Water Feature / Paving -->
    <rect x="25" y="40" width="80" height="40" fill="rgba(56,189,248,0.2)" stroke="#38BDF8" stroke-width="1" rx="4" />
    <text x="65" y="64" font-family="sans-serif" font-size="9" fill="#38BDF8" text-anchor="middle">WATER PLAZA</text>

    <!-- Pedestrian Promenade Spine -->
    <line x1="65" y1="90" x2="65" y2="210" stroke="#10B981" stroke-width="2" stroke-dasharray="6,4" />
    <text x="65" y="150" font-family="'Bahnschrift', sans-serif" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle" transform="rotate(-90 65 150)">PEDESTRIAN GALLERIA</text>
  </g>

  <!-- Drop-Off Loop / Vehicular Circulation -->
  <path d="M 90 170 Q 500 145 910 170" fill="none" stroke="#EAB308" stroke-width="2" stroke-dasharray="6,3" />
  <text x="500" y="165" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EAB308" text-anchor="middle">EXECUTIVE DROP-OFF PORTE-COCHÈRE</text>

  <!-- Scale Bar & Legend -->
  <g transform="translate(40, 485)">
    <!-- Scale Bar -->
    <rect x="0" y="0" width="40" height="5" fill="#FFFFFF" />
    <rect x="40" y="0" width="40" height="5" fill="#000000" stroke="#FFF" stroke-width="0.5" />
    <rect x="80" y="0" width="40" height="5" fill="#FFFFFF" />
    <rect x="120" y="0" width="40" height="5" fill="#000000" stroke="#FFF" stroke-width="0.5" />
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">0</text>
    <text x="40" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">10m</text>
    <text x="80" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">20m</text>
    <text x="120" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">30m</text>
    <text x="160" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">40m</text>
  </g>

  <!-- Legend Items -->
  <g transform="translate(560, 485)">
    <rect x="0" y="0" width="12" height="12" fill="#242B3B" stroke="#C5A880" />
    <text x="18" y="10" font-family="sans-serif" font-size="10" fill="#94A3B8">Service Core</text>

    <rect x="110" y="0" width="12" height="12" fill="rgba(16,185,129,0.3)" stroke="#10B981" />
    <text x="128" y="10" font-family="sans-serif" font-size="10" fill="#94A3B8">Landscape &amp; Retail</text>

    <rect x="250" y="0" width="12" height="12" fill="rgba(56,189,248,0.3)" stroke="#38BDF8" />
    <text x="268" y="10" font-family="sans-serif" font-size="10" fill="#94A3B8">Water Features</text>

    <line x1="370" y1="6" x2="390" y2="6" stroke="#EAB308" stroke-width="2" stroke-dasharray="4,2" />
    <text x="396" y="10" font-family="sans-serif" font-size="10" fill="#94A3B8">Vehicular Access</text>
  </g>
</svg>